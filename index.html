<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: eine Spalte, App-Kopf oben, Tab-Leiste unten fixiert; Inhalte als ruhige Listen mit Zählwerk-Ziffern */
:root{
  --bg:#eef0ec; --surface:#ffffff; --line:#d5d9d1; --fg:#1b1f1a; --muted:#5f665c;
  --accent:#c4561a; --accent-fg:#ffffff;
  --ok:#2f7d4a; --warn:#b7791f; --crit:#b42318; --track:#dfe3db;
  --band:#1c1f1b; --band-fg:#f4f2ee; --band-muted:#a9aea4;
  --f-display:"Arial Narrow","Roboto Condensed",system-ui,-apple-system,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141713; --surface:#1d211c; --line:#30362e; --fg:#e7eae3; --muted:#9aa395;
  --accent:#e8763a; --accent-fg:#141713;
  --ok:#5cb87a; --warn:#e0a748; --crit:#f0685c; --track:#2c322a; --band:#0b0d0a; --band-fg:#f4f2ee; --band-muted:#8f978a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141713; --surface:#1d211c; --line:#30362e; --fg:#e7eae3; --muted:#9aa395;
  --accent:#e8763a; --accent-fg:#141713;
  --ok:#5cb87a; --warn:#e0a748; --crit:#f0685c; --track:#2c322a; --band:#0b0d0a; --band-fg:#f4f2ee; --band-muted:#8f978a; color-scheme:dark}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
header.app{background:var(--band);color:var(--band-fg);border-bottom:4px solid var(--accent);position:relative;overflow:visible;z-index:4}
header.app .ringwrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}
header.app .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 16px;display:flex;align-items:center;gap:14px;position:relative}
header.app .mark{width:46px;height:46px;flex:none;border-radius:12px;background:var(--accent);display:grid;place-items:center}
header.app .mark svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8}
header.app .mark svg .c{fill:#fff;stroke:none}
header.app .t{display:flex;flex-direction:column;gap:2px;min-width:0}
header.app .by{font-size:.78rem;color:var(--band-muted);letter-spacing:.04em}
header.app .lang{margin-left:auto;position:relative;z-index:2;align-self:flex-start}
header.app .lang > button{border:1.5px solid color-mix(in srgb,var(--band-fg) 35%,transparent);background:transparent;color:var(--band-fg);border-radius:8px;padding:5px 9px;font-weight:700;font-size:.8rem;letter-spacing:.06em}
#langMenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:72px}
#langMenu button{border:0;background:transparent;color:var(--fg);padding:9px 12px;border-radius:8px;font-weight:700;font-size:.9rem;text-align:left}
#langMenu button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
header.app .rings{position:absolute;right:-60px;top:50%;width:220px;height:220px;transform:translateY(-50%);opacity:.09;pointer-events:none}
header.app .rings circle{fill:none;stroke:var(--band-fg);stroke-width:2}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,5.4vw,1.6rem);letter-spacing:.01em;margin:0;text-transform:uppercase;line-height:1.05}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;margin:0;color:var(--muted)}
.store{font-size:.78rem;color:var(--muted)}
#view{display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* System-Wahl */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-fg)}

/* Eingabe-Panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.counter{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.counter .big{font-family:var(--f-num);font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.counter .of{color:var(--muted);font-size:.9rem}
.counter .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px;align-self:stretch;margin-left:auto}
.cal{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--accent);color:var(--accent);border-radius:8px;padding:3px 10px;font-weight:700;font-size:1rem;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cal small{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.8}
.stat .name .k{color:var(--accent)}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .3s}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted);opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{min-width:0}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 140px;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:3.1em;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
#addForm input{height:58px}
input[type=number],input[type=text],input[type=date]{width:100%;box-sizing:border-box;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:1.05rem}
input.shots{font-family:var(--f-num);font-size:1.6rem;font-weight:700;padding:10px 12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 0;font-family:var(--f-num);font-weight:700}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.danger{background:var(--crit);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toast{font-size:.9rem;color:var(--ok);font-weight:600;min-height:1.3em}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-weight:600;font-size:.95rem;line-height:1.35;animation:pop .35s ease-out}
.note svg{width:20px;height:20px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.note.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.note.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent);border:1.5px solid var(--warn)}
.note.crit{color:#fff;background:var(--crit);animation:pop .35s ease-out,shake .45s .1s ease-in-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.big.bump{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.08);color:var(--accent)}}
.bar i.flash{animation:flash 1s ease-out}
@keyframes flash{0%{filter:brightness(1.5)}100%{filter:none}}

/* Verlauf */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .d{color:var(--muted);flex:1}
.list .n{font-family:var(--f-num);font-weight:700}
.x{border:0;background:transparent;color:var(--muted);font-size:1.2rem;padding:4px 8px;border-radius:8px}
.x.armed{background:var(--crit);color:#fff;font-size:.8rem;font-weight:700}

/* Statistik */
.stat{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;border-left-width:5px}
.stat.ok{border-left-color:var(--ok)} .stat.warn{border-left-color:var(--warn)} .stat.crit{border-left-color:var(--crit)}
.stat .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stat .name{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.pill{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.remain{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.remain .big{font-family:var(--f-num);font-size:2rem;font-weight:700;line-height:1}
.spark{display:block;width:100%;height:auto;overflow:visible}
.spark .area{fill:color-mix(in srgb,var(--accent) 16%,transparent)}
.spark .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark .critl{stroke:var(--crit);stroke-width:1.5;stroke-dasharray:5 4}
.spark .warnl{stroke:var(--warn);stroke-width:1;stroke-dasharray:2 4}
.spark .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.spark .pt{fill:var(--accent)}
.spark text{font-family:var(--f-body);font-size:10px;fill:var(--muted)}
.spark text.ct{fill:var(--crit);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--f-num);font-weight:700;font-size:1rem}

/* Systeme verwalten */
.sys{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sys:last-child{border-bottom:0}
.sys .meta{flex:1;min-width:0}
.sys .meta b{font-family:var(--f-display);font-size:1.15rem;display:block}
.sys .meta span{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.hint{font-size:.82rem;color:var(--muted)}
.err{color:var(--crit);font-size:.88rem;font-weight:600;min-height:1.2em}

/* Teilen */
.news{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:14px;animation:pop .35s ease-out}
.news h3{margin:0;font-family:var(--f-display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);display:flex;align-items:center;gap:8px}
.news h3 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.news ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.news li{font-size:.95rem;line-height:1.35}
.news .btn{padding:10px 14px;font-size:.95rem;align-self:flex-start}
.shared{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;color:var(--accent);letter-spacing:.03em}
.shared svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2}
.syncline{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.code{font-family:var(--f-num);font-size:1.8rem;font-weight:700;letter-spacing:.08em;color:var(--fg);background:var(--bg);border:1.5px dashed var(--accent);border-radius:12px;padding:10px 14px;text-align:center;user-select:all;-webkit-user-select:all}
.who{font-size:.78rem;color:var(--muted);margin-left:6px}
input.codein{font-family:var(--f-num);font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:transparent;padding:12px 4px 14px;font-weight:600;font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  const n=(navigator.languages&&navigator.languages[0]||navigator.language||"de").slice(0,2).toLowerCase(); return LANGS.includes(n)?n:"de"; })();
const T = (k,...a) => { const v=(I18N[lang]&&I18N[lang][k]!==undefined)?I18N[lang][k]:I18N.de[k]; return typeof v==="function"?v(...a):v; };
let langOpen = false;
function applyStatic(){
  document.documentElement.lang = lang;
  document.title = T("title")+" By René Homberger";
  const q=s=>document.querySelector(s);
  q("#hTitle").textContent=T("title");
  q("#tErf").textContent=T("tabErf"); q("#tStat").textContent=T("tabStat"); q("#tSys").textContent=T("tabSys");
  q("nav.tabs").setAttribute("aria-label",T("views"));
  const lb=q("#langBtn"); lb.textContent=lang.toUpperCase(); lb.setAttribute("aria-expanded",String(langOpen)); lb.setAttribute("aria-label",T("langLbl")+": "+lang.toUpperCase());
  const m=q("#langMenu"); m.hidden=!langOpen;
  m.innerHTML=LANGS.map(l=>`<button data-lang="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("");
}

/* ---------- Teilen / Synchronisation (Firebase) ----------
   Ein geteiltes System hat s.share = Code (8 Zeichen). In Firestore:
   shared/{code} = Systemdaten, shared/{code}/entries/{id} = Einträge.
   Lokal bleibt alles in localStorage; Firestore gleicht ab.
   Einträge mit pend:true sind lokal erfasst, aber noch nicht vom Server bestätigt;
   s.delPend = Eintrags-IDs, deren Löschung noch nicht bestätigt ist. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBwULotW4-2HKuBzbr72Wu9cc_HchJ9xhQ",
  authDomain: "schusszahlrechner.firebaseapp.com",
  projectId: "schusszahlrechner",
  storageBucket: "schusszahlrechner.firebasestorage.app",
  messagingSenderId: "934947165700",
  appId: "1:934947165700:web:998269001c1ca27c2ac751"
};
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const LS_NAME = LS_KEY+".name", LS_NEWS = LS_KEY+".news";
let myName = ""; try{ myName = localStorage.getItem(LS_NAME)||""; }catch(e){}
let news = []; try{ news = JSON.parse(localStorage.getItem(LS_NEWS)||"[]"); if(!Array.isArray(news)) news=[]; }catch(e){ news=[]; }
const saveNews = () => { try{ localStorage.setItem(LS_NEWS, JSON.stringify(news.slice(-30))); }catch(e){} };
const fmtCode = c => c ? c.slice(0,4)+"-"+c.slice(4) : "";
const cleanCode = v => String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/[01IO]/g,"");
function newCode(){ const a=new Uint32Array(8); crypto.getRandomValues(a); return Array.from(a,x=>CODE_CHARS[x%CODE_CHARS.length]).join(""); }

const Sync = {
  ready:null, db:null, uid:null, subs:{}, online:navigator.onLine,
  enabled(){ return !!(FIREBASE_CONFIG && window.FB); },
  init(){
    if(this.ready) return this.ready;
    if(!this.enabled()) return Promise.reject(new Error("off"));
    this.ready = new Promise((resolve)=>{
      const FB=window.FB;
      const app=FB.initializeApp(FIREBASE_CONFIG);
      const auth=FB.getAuth(app);
      this.db=FB.initializeFirestore(app,{localCache:FB.memoryLocalCache()});
      if(FIREBASE_CONFIG.emulator){ FB.connectAuthEmulator(auth,"http://"+FIREBASE_CONFIG.emulator.auth,{disableWarnings:true}); const [h,pt]=FIREBASE_CONFIG.emulator.firestore.split(":"); FB.connectFirestoreEmulator(this.db,h,+pt); }
      let done=false;
      FB.onAuthStateChanged(auth,u=>{
        if(u && !done){ done=true; this.uid=u.uid; resolve(); }
        else if(!u){ FB.signInAnonymously(auth).catch(()=>{}); }
      });
      window.addEventListener("online",()=>{ if(!done) FB.signInAnonymously(auth).catch(()=>{}); });
    });
    return this.ready;
  },
  col(code){ return window.FB.collection(this.db,"shared",code,"entries"); },
  ref(code,id){ const FB=window.FB; return id ? FB.doc(this.db,"shared",code,"entries",id) : FB.doc(this.db,"shared",code); },
  metaOf(s){ return {nr:String(s.nr).slice(0,40), kal:String(s.kal||"").slice(0,40), name:String(s.name||"").slice(0,60), crit:+s.crit, start:+s.start||0, at:window.FB.serverTimestamp()}; },
  entryOf(e){ return {d:e.d, n:Math.round(+e.n), by:String(e.by||myName||"").slice(0,40), byId:this.uid, at:window.FB.serverTimestamp()}; },
  async share(s){
    await this.init();
    let code=newCode();
    for(let i=0;i<3;i++){ const ex=await window.FB.getDoc(this.ref(code)); if(!ex.exists()) break; code=newCode(); }
    const ents=(s.entries||[]).map(({pend,...e})=>({...e,by:e.by||myName,byId:this.uid}));
    await window.FB.setDoc(this.ref(code), this.metaOf(s));
    for(let i=0;i<ents.length;i+=400){
      const b=window.FB.writeBatch(this.db);
      ents.slice(i,i+400).forEach(e=>b.set(this.ref(code,e.id), this.entryOf(e)));
      await b.commit();
    }
    const ns={...s, share:code, synced:true, entries:ents, delPend:[], gone:[], lastAt:null};
    replaceSystem(ns); this.watch(ns); return code;
  },
  async join(code){
    await this.init();
    if(systems.some(x=>x.share===code)) throw new Error("schon");
    const m=await window.FB.getDoc(this.ref(code));
    if(!m.exists()) throw new Error("nicht gefunden");
    const meta=m.data();
    const snap=await window.FB.getDocs(this.col(code));
    const remote=[], gone=[]; let lastAt=null;
    snap.docs.forEach(d=>{ const x=d.data(); lastAt=maxAt(lastAt,x.at); if(x.del) gone.push(d.id); else remote.push({id:d.id,...pick(x)}); });
    const ids=new Set(snap.docs.map(d=>d.id));
    const local=systems.find(x=>x.nr===meta.nr && !x.share);
    const mine=local ? (local.entries||[]).filter(e=>!ids.has(e.id)).map(e=>({...e,by:e.by||myName,byId:this.uid,pend:true})) : [];
    const ns={...(local||{id:uid()}), nr:meta.nr, kal:meta.kal||"", name:meta.name||"", crit:meta.crit, start:meta.start||0,
      share:code, synced:true, delPend:[], gone, lastAt, entries:[...remote,...mine]};
    replaceSystem(ns);
    mine.forEach(e=>this.pushEntry(code,e));
    this.watch(ns);
    return ns;
  },
  pushEntry(code,e){ if(!this.db||!this.uid) return; window.FB.setDoc(this.ref(code,e.id), this.entryOf(e)).catch(()=>{}); },
  dropEntry(code,id){ if(!this.db) return; window.FB.updateDoc(this.ref(code,id),{del:true, at:window.FB.serverTimestamp()}).catch(()=>{}); },
  pushMeta(s){ if(!this.db||!this.uid) return; window.FB.setDoc(this.ref(s.share), this.metaOf(s)).catch(()=>{}); },
  unwatch(code){ (this.subs[code]||[]).forEach(f=>{try{f()}catch(e){}}); delete this.subs[code]; },
  watch(s){
    const code=s.share; if(!code || this.subs[code] || !this.db) return;
    const FB=window.FB;
    // offene Änderungen nachsenden (z. B. offline erfasst, App danach geschlossen)
    (s.entries||[]).filter(e=>e.pend).forEach(e=>this.pushEntry(code,e));
    (s.delPend||[]).forEach(id=>this.dropEntry(code,id));
    const u1=FB.onSnapshot(this.ref(code), snap=>{
      if(snap.metadata.fromCache || snap.metadata.hasPendingWrites || !snap.exists()) return;
      const d=snap.data(); const cur=systems.find(x=>x.share===code); if(!cur) return;
      const meta={nr:d.nr,kal:d.kal||"",name:d.name||"",crit:d.crit,start:d.start||0};
      if(["nr","kal","name","crit","start"].some(k=>cur[k]!==meta[k])) replaceSystem({...cur,...meta});
    },()=>{});
    // Nur Einträge holen, die seit dem letzten Abgleich neu oder geändert sind (spart Lesezugriffe)
    const q = s.lastAt ? FB.query(this.col(code), FB.where("at",">",new FB.Timestamp(s.lastAt.s,s.lastAt.n))) : this.col(code);
    const u2=FB.onSnapshot(q, snap=>{
      if(snap.metadata.fromCache) return;
      const cur=systems.find(x=>x.share===code); if(!cur) return;
      const map=new Map((cur.entries||[]).map(e=>[e.id,e]));
      const gone=new Set(cur.gone||[]); let delPend=[...(cur.delPend||[])];
      let lastAt=cur.lastAt||null; const fresh=[];
      snap.docs.forEach(d=>{
        const x=d.data({serverTimestamps:"none"}), pending=d.metadata.hasPendingWrites;
        if(!pending) lastAt=maxAt(lastAt,x.at);
        if(x.del){ map.delete(d.id); gone.add(d.id); if(!pending) delPend=delPend.filter(id=>id!==d.id); return; }
        if(gone.has(d.id)) return;
        if(!map.has(d.id) && x.byId!==this.uid) fresh.push({id:d.id,...pick(x)});
        map.set(d.id,{id:d.id,...pick(x),...(pending?{pend:true}:{})});
      });
      const ns={...cur, entries:[...map.values()], delPend, gone:[...gone].slice(-500), lastAt, synced:true};
      if(cur.synced && fresh.length){
        const tot=calc(ns).total;
        fresh.forEach(e=>news.push({sys:sysLabel(ns), by:e.by||T("someone"), n:e.n, d:e.d, total:tot}));
        saveNews();
      }
      replaceSystem(ns);
    },()=>{});
    this.subs[code]=[u1,u2];
  },
  start(){
    if(!this.enabled() || !systems.some(x=>x.share)) return;
    this.init().then(()=>systems.filter(x=>x.share).forEach(x=>this.watch(x))).catch(()=>{});
  }
};
function maxAt(a,t){ if(!t||typeof t.seconds!=="number") return a; const v={s:t.seconds,n:t.nanoseconds}; return (!a || v.s>a.s || (v.s===a.s && v.n>a.n)) ? v : a; }
function pick(d){ return {d:String(d.d), n:+d.n, by:String(d.by||""), byId:String(d.byId||"")}; }
function replaceSystem(ns){
  const i=systems.findIndex(x=>x.id===ns.id);
  if(i>=0) systems[i]=ns; else systems.push(ns);
  saveLocal(); render();
}

/* ---------- Berechnung ---------- */
function calc(s){
  const fired = (s.entries||[]).reduce((a,e)=>a+(+e.n||0),0);
  const total = (+s.start||0) + fired;
  const crit = +s.crit||0;
  const remaining = Math.max(0, crit-total);
  const pct = crit>0 ? total/crit : 0;
  const level = pct>=1 ? "crit" : pct>=WARN_AT ? "warn" : "ok";
  const n = (s.entries||[]).length;
  const avg = n ? fired/n : 0;
  const sorted = [...(s.entries||[])].sort((a,b)=>b.d.localeCompare(a.d)||(b.id>a.id?1:-1));
  const last = sorted[0]?.d;
  const estLeft = avg>0 && remaining>0 ? Math.ceil(remaining/avg) : null;
  return {fired,total,crit,remaining,pct,level,n,avg,last,sorted,estLeft,over:Math.max(0,total-crit)};
}
const lvTxt = l => T(l==="crit"?"lvCrit":l==="warn"?"lvWarn":"lvOk");
const sysLabel = s => s.name ? `${s.nr} · ${s.name}` : s.nr;
const sysFull = s => [s.nr, s.kal, s.name].filter(Boolean).join(" · ");
const sortSys = arr => [...arr].sort((a,b)=>String(a.nr).localeCompare(String(b.nr),"de",{numeric:true}));

/* ---------- Ansichten ---------- */
function bar(c){
  const w = Math.min(100, c.pct*100);
  return `<div class="bar" role="img" aria-label="${Math.round(c.pct*100)} % des kritischen Bereichs"><span class="mark" style="left:${WARN_AT*100}%"></span><i class="${c.level}" style="width:${w}%"></i></div>`;
}

const ICON = {
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.6v.1"/></svg>',
  crit:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6M12 16.6v.1"/></svg>'
};
function note(text,level){ return `<div class="note ${level}" role="status">${ICON[level]||ICON.ok}<span>${text}</span></div>`; }

function spark(s,c){
  if(!c.n) return "";
  const byDay = {};
  (s.entries||[]).forEach(e=>{ byDay[e.d]=(byDay[e.d]||0)+(+e.n||0); });
  const days = Object.keys(byDay).sort();
  const t = d => Date.parse(d+"T12:00:00");
  let cum = +s.start||0;
  const pts = [{t:t(days[0])-86400000*Math.max(1,(t(days[days.length-1])-t(days[0]))/86400000*0.04), v:cum}];
  days.forEach(d=>{ cum+=byDay[d]; pts.push({t:t(d),v:cum}); });
  const W=320,H=120,L=4,R=56,T=10,B=22;
  const t0=pts[0].t, t1=Math.max(pts[pts.length-1].t,t0+1);
  const vMax=Math.max(c.crit,c.total)*1.04;
  const vMin=Math.max(0,Math.min(+s.start||0,c.crit*WARN_AT)-(vMax-Math.min(+s.start||0,c.crit*WARN_AT))*0.15);
  const x=v=>L+(v-t0)/(t1-t0)*(W-L-R), y=v=>T+(1-(v-vMin)/(vMax-vMin))*(H-T-B);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=`${line}L${x(pts[pts.length-1].t).toFixed(1)},${H-B}L${x(t0).toFixed(1)},${H-B}Z`;
  const last=pts[pts.length-1], yc=y(c.crit), yw=y(c.crit*WARN_AT);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf der Schusszahl, aktuell ${fmt(c.total)} von ${fmt(c.crit)}">
    <line class="grid" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    <line class="warnl" x1="${L}" x2="${W-R}" y1="${yw}" y2="${yw}"/>
    <line class="critl" x1="${L}" x2="${W-R}" y1="${yc}" y2="${yc}"/>
    <text class="ct" x="${W-R+6}" y="${yc+3.5}">${fmt(c.crit)}</text>
    <text x="${W-R+6}" y="${yw+3.5}">${Math.round(WARN_AT*100)} %</text>
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    ${pts.slice(1,-1).map(p=>`<circle class="pt" cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2"/>`).join("")}
    <circle class="end" cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4.5"/>
    <text x="${L}" y="${H-6}">${fdate(days[0])}</text>
    ${days.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${fdate(days[days.length-1])}</text>`:""}
  </svg>`;
}

function render(){

function runAnim(){
  if(!anim || tab!=="erfassen" || anim.id!==selId){ anim=null; return; }
  const el=document.getElementById("bigTotal"); if(!el){ anim=null; return; }
  const from=anim.from, to=+el.dataset.to; anim=null;
  const bi=document.querySelector(".panel .bar i"); if(bi){ bi.classList.add("flash"); }
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || to<=from) return;
  const t0=performance.now(), dur=650;
  const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=fmt(from+(to-from)*e);
    if(k<1) requestAnimationFrame(step); else { el.textContent=fmt(to); el.classList.add("bump"); } };
  requestAnimationFrame(step);
}

/* ---------- Interaktion ---------- */
document.addEventListener("click", async e=>{
  const t = e.target.closest("button");
  if(langOpen && !(t && (t.id==="langBtn" || t.dataset.lang))){ langOpen=false; applyStatic(); }
  if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; armed=null; toast=""; render(); window.scrollTo(0,0); return; }
  if(t.dataset.sel){ selId=t.dataset.sel; try{localStorage.setItem(LS_KEY+".sel",selId)}catch(_){} armed=null; toast=""; render(); return; }
  if(t.id==="langBtn"){ langOpen=!langOpen; applyStatic(); return; }
  if(t.dataset.lang){ lang=t.dataset.lang; langOpen=false; try{localStorage.setItem("schusszahl.v1.lang",lang)}catch(_){} render(); return; }
  if(t.hasAttribute("data-news-ok")){ news=[]; saveNews(); render(); return; }
  if(t.hasAttribute("data-join")){ shareUI="join"; shareMsg={text:"",level:"ok"}; editId=undefined; render(); document.getElementById("f-code")?.focus(); return; }
  if(t.hasAttribute("data-join-cancel")){ shareUI=null; render(); return; }
  if(t.dataset.share){
    const nm=(document.getElementById("f-myname")?.value||"").trim();
    if(!nm){ shareMsg={text:T("errName"),level:"err"}; render(); return; }
    myName=nm; try{localStorage.setItem(LS_NAME,nm)}catch(_){}
    if(!navigator.onLine){ shareMsg={text:T("errNetCode"),level:"err"}; render(); return; }
    const s=systems.find(x=>x.id===t.dataset.share); if(!s) return;
    t.disabled=true; t.textContent=T("making");
    try{ await Sync.share(s); shareMsg={text:T("codeMade"),level:"ok"}; }
    catch(err){ shareMsg={text:T("errGeneric"),level:"err"}; }
    render(); return;
  }
  if(t.dataset.sendCode||t.dataset.copyCode){
    const s=systems.find(x=>x.id===(t.dataset.sendCode||t.dataset.copyCode)); if(!s||!s.share) return;
    const txt=T("shareText",sysFull(s),fmtCode(s.share),"https://hombi1988.github.io/Schusszahlrechner/");
    if(t.dataset.sendCode && navigator.share){ try{ await navigator.share({text:txt}); return; }catch(err){ if(err&&err.name==="AbortError") return; } }
    try{ await navigator.clipboard.writeText(t.dataset.sendCode?txt:fmtCode(s.share)); shareMsg={text:T("copied"),level:"ok"}; }
    catch(err){ shareMsg={text:T("copyFail"),level:"err"}; }
    render(); return;
  }
  if(t.dataset.unshare){
    const k="u:"+t.dataset.unshare;
    if(armed!==k){ armed=k; render(); return; }
    armed=null;
    const s=systems.find(x=>x.id===t.dataset.unshare); if(!s) return;
    Sync.unwatch(s.share);
    const {share,synced,delPend,gone,lastAt,...rest}=s;
    replaceSystem({...rest, entries:(s.entries||[]).map(({pend,...e})=>e)});
    shareMsg={text:T("unshared"),level:"ok"}; render(); return;
  }
  if(t.hasAttribute("data-export")){ exportData(); return; }
  if(t.hasAttribute("data-import")){ document.getElementById("importFile").click(); return; }
  if(t.hasAttribute("data-new")){ editId=null; shareUI=null; render(); document.getElementById("f-nr")?.focus(); return; }
  if(t.hasAttribute("data-goto-new")){ tab="systeme"; editId=null; render(); document.getElementById("f-nr")?.focus(); return; }
  if(t.hasAttribute("data-cancel")){ editId=undefined; render(); return; }
  if(t.dataset.edit){ editId=t.dataset.edit; shareUI=null; shareMsg={text:"",level:"ok"}; armed=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.delSys){
    const k="s:"+t.dataset.delSys;
    if(armed!==k){ armed=k; render(); return; }
    armed=null; if(editId===t.dataset.delSys) editId=undefined;
    { const ds=systems.find(x=>x.id===t.dataset.delSys); if(ds&&ds.share) Sync.unwatch(ds.share); }
    try{ await removeSystem(t.dataset.delSys); }catch(err){ alertErr(); }
    return;
  }
  if(t.dataset.delEntry){
    const k="e:"+t.dataset.delEntry;
    if(armed!==k){ armed=k; render(); return; }
    armed=null;
    const s = systems.find(x=>x.id===selId); if(!s) return;
    const ns = {...s, entries:(s.entries||[]).filter(x=>x.id!==t.dataset.delEntry)};
    if(s.share){ const id=t.dataset.delEntry, wasPend=(s.entries||[]).find(x=>x.id===id)?.pend;
      if(!wasPend) ns.delPend=[...(s.delPend||[]),id];
      ns.gone=[...(s.gone||[]),id]; Sync.dropEntry(s.share,id); }
    toast=T("entryDeleted"); toastLevel="ok";
    try{ await putSystem(ns); }catch(err){ alertErr(); }
    return;
  }
});

document.addEventListener("submit", async e=>{
  e.preventDefault();
  if(e.target.id==="addForm"){
    const n = Math.round(+document.getElementById("shots").value);
    const d = document.getElementById("date").value || today();
    const errEl = document.getElementById("addErr");
    if(!(n>0)){ errEl.textContent=T("errShots"); return; }
    const s = systems.find(x=>x.id===selId); if(!s) return;
    const entry = s.share ? {id:uid(), d, n, by:myName, byId:Sync.uid||"", pend:true} : {id:uid(), d, n};
    const ns = {...s, entries:[...(s.entries||[]), entry]};
    if(s.share) Sync.pushEntry(s.share, entry);
    const cb = calc(s), after = calc(ns), before = cb.level;
    const label = esc(sysLabel(s));
    if(after.level==="crit" && before!=="crit"){
      toastLevel="crit"; toast=T("tCritNew",label,fmt(after.total),fmt(after.crit));
    } else if(after.level==="crit"){
      toastLevel="crit"; toast=T("tCrit",fmt(n),label,fmt(after.over));
    } else if(after.level==="warn" && before==="ok"){
      toastLevel="warn"; toast=T("tWarn",fmt(n),label,fmt(after.remaining));
    } else {
      toastLevel = after.level==="warn" ? "warn" : "ok";
      toast=T("tOk",fmt(n),label,fmt(after.remaining));
    }
    if(toastLevel!=="ok" && after.level!==before){ try{ navigator.vibrate && navigator.vibrate(toastLevel==="crit"?[180,80,180]:120); }catch(_){} }
    anim = {id:s.id, from:cb.total};
    armed=null;
    try{ await putSystem(ns); }catch(err){ alertErr(); }
  }
  if(e.target.id==="joinForm"){
    const code=cleanCode(document.getElementById("f-code").value);
    const nm=(document.getElementById("f-myname").value||"").trim();
    const show=(text)=>{ shareMsg={text,level:"err"}; render(); const c=document.getElementById("f-code"); if(c) c.value=fmtCode(code); };
    if(code.length!==8) return show(T("errCodeLen"));
    if(!nm) return show(T("errName2"));
    myName=nm; try{localStorage.setItem(LS_NAME,nm)}catch(_){}
    if(!navigator.onLine) return show(T("errNetJoin"));
    const btn=e.target.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent=T("connecting");
    try{
      const ns=await Sync.join(code);
      shareUI=null; selId=ns.id; try{localStorage.setItem(LS_KEY+".sel",selId)}catch(_){}
      tab="erfassen"; toast=T("joined",esc(sysFull(ns))); toastLevel="ok"; shareMsg={text:"",level:"ok"};
      render(); window.scrollTo(0,0);
    }catch(err){
      show(err.message==="nicht gefunden" ? T("errNoCode") : err.message==="schon" ? T("errAlready") : T("errGeneric"));
    }
    return;
  }
  if(e.target.id==="sysForm"){
    const nr = document.getElementById("f-nr").value.trim();
    const name = document.getElementById("f-name").value.trim();
    const kal = document.getElementById("f-kal").value.trim();
    const crit = Math.round(+document.getElementById("f-crit").value);
    const start = Math.max(0, Math.round(+document.getElementById("f-start").value||0));
    const errEl = document.getElementById("sysErr");
    if(!nr){ errEl.textContent=T("errNr"); return; }
    if(!(crit>0)){ errEl.textContent=T("errCrit"); return; }
    if(systems.some(x=>x.nr===nr && x.id!==editId)){ errEl.textContent=T("errDup"); return; }
    const old = editId ? systems.find(x=>x.id===editId) : null;
    const s = old ? {...old,nr,kal,name,crit,start} : {id:uid(),nr,kal,name,crit,start,entries:[]};
    editId = undefined;
    if(old && old.share){ Sync.pushMeta(s); }
    if(!old){ selId = s.id; try{localStorage.setItem(LS_KEY+".sel",selId)}catch(_){} }
    try{ await putSystem(s); }catch(err){ alertErr(); }
  }
});

async function exportData(){
  const name = `schusszahl-sicherung-${today()}.json`;
  const blob = new Blob([JSON.stringify({app:"schusszahlrechner",v:1,exported:new Date().toISOString(),systems},null,2)],{type:"application/json"});
  const msg = document.getElementById("bkMsg");
  try{
    const file = new File([blob],name,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); msg.textContent=T("bkShared"); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  msg.textContent=T("bkSaved",name);
}
document.addEventListener("change", async e=>{
  if(e.target.id!=="importFile") return;
  const f=e.target.files[0]; if(!f) return;
  const msg=document.getElementById("bkMsg");
  try{
    const data=JSON.parse(await f.text());
    const list=Array.isArray(data)?data:data.systems;
    if(!Array.isArray(list)) throw 0;
    let n=0;
    for(const x of list){
      if(!x || !x.nr || !(+x.crit>0)) continue;
      const clean={id:String(x.id||uid()),nr:String(x.nr),kal:String(x.kal||""),name:String(x.name||""),crit:+x.crit,start:+x.start||0,
        entries:(Array.isArray(x.entries)?x.entries:[]).filter(en=>en&&/^\d{4}-\d{2}-\d{2}$/.test(en.d)&&+en.n>0).map(en=>({id:String(en.id||uid()),d:en.d,n:Math.round(+en.n),by:String(en.by||""),byId:String(en.byId||"")}))};
      if(typeof x.share==="string" && /^[A-Z2-9]{8}$/.test(x.share)){ clean.share=x.share; clean.synced=false; clean.delPend=[]; }
      systems=systems.filter(y=>y.nr!==clean.nr && y.id!==clean.id); systems.push(clean); n++;
    }
    saveLocal(); render(); Sync.start();
    document.getElementById("bkMsg").style.color=""; document.getElementById("bkMsg").textContent=T("bkRead",n);
  }catch(err){ msg.textContent=""; const m=document.getElementById("bkMsg"); m.style.color="var(--crit)"; m.textContent=T("bkBad"); }
  e.target.value="";
});

function alertErr(){ toast=""; const v=document.getElementById("view"); const d=document.createElement("div"); d.className="err"; d.textContent=T("errSave"); v.prepend(d); }

/* ---------- Start ---------- */
systems = loadLocal();
render();
Sync.start();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hadController && !reloading){ reloading=true; location.reload(); } });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
      const check=()=>{ if(navigator.onLine) reg.update().catch(()=>{}); };
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
      window.addEventListener("online",check);
    }).catch(()=>{});
  });
}
});
